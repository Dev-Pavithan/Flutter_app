<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="WSTSC Attendance - Professional Student Management.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="WSTSC Attendance">
  <link rel="apple-touch-icon" href="favicon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>WSTSC Attendance</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body { background-color: #020617; margin: 0; padding: 0; height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; font-family: sans-serif; }
    .loader-container { display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .loader { width: 48px; height: 48px; border: 3px solid #6366f1; border-bottom-color: transparent; border-radius: 50%; display: inline-block; box-sizing: border-box; animation: rotation 1s linear infinite; }
    .loader-text { margin-top: 16px; color: #6366f1; font-weight: bold; letter-spacing: 0.1em; font-size: 14px; opacity: 0.8; }
    @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>

  <script src="flutter_bootstrap.js" async></script>
</head>
<body>
  <div class="loader-container">
    <div class="loader"></div>
    <div class="loader-text">WSTSC ATTENDANCE</div>
  </div>
</body>
</html>
